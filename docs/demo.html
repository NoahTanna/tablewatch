  for (const f of FLOOR.tables) T[f.id] = { id: f.id, seats: f.seats || 4, state: "FREE", unattended_since: null, free_since: null, dish_count: SET, ...VISIT() };

  // ---- same rules as backend/state.py ----
  function observe(t, people, dishes, count) {
    const before = { ...t };
    t.dish_count = count;
    if (people) {
      if (t.state !== "OCCUPIED") Object.assign(t, VISIT(), { seated_at: now(), empty_before: t.free_since != null ? now() - t.free_since : null, free_since: null });
      t.state = "OCCUPIED"; t.unattended_since = null;
      if (t.baseline == null) t.baseline = t.peak = count;
      if (t.served_at == null && Math.abs(count - t.baseline) >= SERVED_DELTA) t.served_at = now();
      t.peak = Math.max(t.peak, count);
      const gone = t.served_at != null && count <= t.baseline && t.peak - count >= SERVED_DELTA;
      t.plates_gone_since = gone ? (t.plates_gone_since ?? now()) : null;
    } else if (dishes) {
      if (t.unattended_since == null && t.state === "OCCUPIED") t.unattended_since = now();
    } else toFree(t);
    tick(t); record(before, t);
  }
  function toFree(t) { if (t.state !== "FREE") t.free_since = now(); t.state = "FREE"; t.unattended_since = null; Object.assign(t, VISIT()); }
  function tick(t) { if (t.state !== "NEEDS_CLEARING" && t.unattended_since != null && now() - t.unattended_since >= CFG.clearAfter) t.state = "NEEDS_CLEARING"; }
  function record(old, t) {
    if (old.seated_at == null || t.seated_at === old.seated_at) return;
    const left = old.unattended_since ?? now();
    if (left - old.seated_at >= CFG.minVisit) visits.push({ stay: left - old.seated_at, first: old.served_at != null ? old.served_at - old.seated_at : null, empty: old.empty_before });
  }
  function longStayAfter() {
    if (visits.length < 5) return CFG.longStay;
    const s = visits.map((v) => v.stay).sort((a, b) => a - b);
    return 1.5 * s[Math.floor(s.length / 2)];
  }
  function view(t) {
    const n = now(); let stage = "FREE", alert = null; const hints = [];
    if (t.state === "NEEDS_CLEARING") { stage = "CLEAR"; alert = "clear"; }
    else if (t.state === "OCCUPIED" && t.unattended_since != null) stage = "LEFT";
    else if (t.state === "OCCUPIED") {
      if (t.served_at == null) { stage = "SEATED"; if (n - t.seated_at >= CFG.notServed) alert = "not_served"; }
      else if (t.plates_gone_since != null && n - t.plates_gone_since >= CFG.platesGone) { stage = "FINISHING"; if (n - t.plates_gone_since >= CFG.checkHint) hints.push("check"); }
      else stage = "SERVED";
      if (n - t.seated_at >= longStayAfter()) hints.push("long_stay");
    }
    return { ...t, stage, alert, hints };
  }
  function summary() {
    const seated = Object.values(T).filter((t) => t.state === "OCCUPIED" && t.unattended_since == null);
    const avg = (xs) => { xs = xs.filter((x) => x != null); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
    return { tables_in_use: seated.length, tables_total: FLOOR.tables.length,
      seats_in_use: seated.reduce((a, t) => a + t.seats, 0), seats_total: Object.values(T).reduce((a, t) => a + t.seats, 0),
      avg_first_service: avg(visits.map((v) => v.first)), avg_empty_between: avg(visits.map((v) => v.empty)), visits_tonight: visits.length };
  }

  // ---- a sped-up dinner service, same shape as simulator.py ----
  function meal() {
    const r = (a, b) => a + Math.random() * (b - a);
    const forgotten = Math.random() < 0.15, long = Math.random() < 0.1, neglected = Math.random() < 0.35;
    return [
      [false, true, SET, r(5, 20)],                                   // table set
      [true, true, SET, forgotten ? r(40, 50) : r(5, 15)],            // guests sat down
      [true, true, SET + 2, r(5, 10)],                                // drinks arrived
      [true, true, SET + 5, long ? r(110, 130) : r(25, 50)],          // food served
      [true, true, SET, r(5, 30)],                                    // plates cleared, still sitting
      [false, true, SET, neglected ? r(30, 45) : r(4, 10)],           // guests left, dishes remain
      [false, false, 0, r(4, 12)],                                    // bussed
    ];
  }
  const plan = {};
  for (const id in T) {
    const steps = meal(), start = Math.floor(Math.random() * 4);
    if (start >= 2) Object.assign(T[id], { state: "OCCUPIED", seated_at: now() - 10 - Math.random() * 30, served_at: now() - 5, baseline: SET, peak: SET + 5 });
    plan[id] = { steps: steps.slice(start), until: 0 };
  }
  function step() {
    const n = now();
    for (const id in T) {
      const p = plan[id];
      if (n >= p.until) {
        if (!p.steps.length) p.steps = meal();
        const [people, dishes, count, dur] = p.steps.shift();
        p.until = n + dur;
        observe(T[id], people, dishes, count);
      }
      tick(T[id]);
    }
    push();
  }

  // ---- the /api the dashboard talks to ----
  const listeners = new Set();
  const lastSent = {};
  function push(force) {
    const s = summary();
    for (const id in T) {
      const v = view(T[id]), key = JSON.stringify(v);
      if (!force && lastSent[id] === key) continue;
      lastSent[id] = key;
      const data = JSON.stringify({ now: now(), table: v, summary: s, last_event_at: now() });
      listeners.forEach((es) => es.onmessage && es.onmessage({ data }));
    }
  }
  const reply = (body) => Promise.resolve({ ok: true, json: () => Promise.resolve(body) });
  const DAY = 86400000;
  const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const noon = (iso) => new Date(iso + "T12:00:00");
  const tonight = () => isoOf(new Date(Date.now() - 4 * 3600 * 1000));
  const offsetOf = (iso) => Math.round((noon(tonight()) - noon(iso)) / DAY);
  const label = (iso) => { const d = noon(iso); return `${d.toLocaleDateString("en-US", { weekday: "long" })}, ${d.toLocaleDateString("en-US", { month: "short" })} ${d.getDate()}`; };
  const shift = () => Math.round((noon(tonight()) - noon(REPORTS.base)) / 1000);
  function nightReport(iso) {
    const off = offsetOf(iso), r = REPORTS.nights[off];
    if (!r) return { day: iso, label: label(iso), parties: 0 };
    const s = shift(), at = (x) => (x ? { ...x, at: x.at + s } : x);
    return { ...r, day: iso, label: label(iso), worst_clear_wait: at(r.worst_clear_wait), slowest_first_service: r.slowest_first_service.map(at) };
  }
  function weekReport(iso) {
    // Same totals as backend/reports.py week(), assembled from the nightly reports.
    const days = Array.from({ length: 7 }, (_, i) => isoOf(new Date(noon(iso) - (6 - i) * DAY)));
    const nights = days.map((d) => {
      const r = nightReport(d), busiest = (r.busy_hours || []).reduce((a, h) => (!a || h.busy > a.busy ? h : a), null);
      const pick = (k) => (r[k] === undefined ? null : r[k]);
      return { day: d, label: r.label, short: noon(d).toLocaleDateString("en-US", { weekday: "short" }), parties: r.parties,
        avg_stay: pick("avg_stay"), avg_first_service: pick("avg_first_service"), late_starts: r.late_starts || 0,
        avg_clear_wait: pick("avg_clear_wait"), went_red: r.went_red || 0, avg_empty_between: pick("avg_empty_between"),
        idle_table_time: r.idle_table_time || 0, extra_parties_estimate: pick("extra_parties_estimate"),
        busiest_hour: busiest && busiest.busy > 0 ? busiest.hour : null };
    });
    const sum = (k) => nights.reduce((a, n) => a + (n[k] || 0), 0);
    const slow = nights.filter((n) => n.parties && n.avg_clear_wait != null).reduce((a, n) => (!a || n.avg_clear_wait > a.avg_clear_wait ? n : a), null);
    return { start: days[0], end: iso, nights, parties: sum("parties"), went_red: sum("went_red"), late_starts: sum("late_starts"),
      late_after: REPORTS.nights[0].late_after, idle_table_time: sum("idle_table_time"),
      extra_parties_estimate: sum("extra_parties_estimate"), slowest_clearing_night: slow ? slow.label : null };
  }

  window.fetch = function (url, opts) {
    const path = String(url);
    if (path === "/api/floor") return reply(FLOOR);
    const rq = path.match(/^\/api\/reports\/(night|week)(?:\?(?:day|end)=([0-9-]+))?$/);
    if (rq) return reply(rq[1] === "night" ? nightReport(rq[2] || tonight()) : weekReport(rq[2] || tonight()));
    if (path === "/api/tables") return reply({ now: now(), last_event_at: now(), summary: summary(), tables: Object.values(T).map(view) });
    const m = path.match(/^\/api\/tables\/([^/]+)\/(clear|served)$/);
    if (m && opts && opts.method === "POST") {
      const t = T[decodeURIComponent(m[1])];
      if (m[2] === "clear") { const b = { ...t }; toFree(t); record(b, t); plan[t.id].steps = meal(); plan[t.id].until = now() + 4; }
      else if (t.state === "OCCUPIED" && t.served_at == null) t.served_at = now();
      setTimeout(push, 0);
      return reply(view(t));
    }
    return Promise.resolve({ ok: false, json: () => Promise.resolve({}) });
  };
  window.EventSource = class {
    constructor() { listeners.add(this); setTimeout(() => { this.onopen && this.onopen(); push(true); }, 50); }
    close() { listeners.delete(this); }
  };
  setInterval(step, 1000);
})();
</script>
<script>
// Reports tab: end-of-night and weekly numbers from /api/reports/*.
// Times come in seconds; everything here is formatting and two small bar charts.
(function () {
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dash = "–";
  const min = (s) => {
    if (s == null) return dash;
    const m = Math.round(s / 60);
    return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
  };
  const hours = (s) => (s == null ? dash : s >= 3600 ? `${(s / 3600).toFixed(1)} h` : `${Math.round(s / 60)} min`);
  const hourLabel = (h) => (h == null ? dash : `${((h + 11) % 12) + 1} ${h < 12 ? "AM" : "PM"}`);
  const timeOf = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const addDays = (isoDay, n) => { const d = new Date(isoDay + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };

  let mode = "night", day = null, today = null, data = null, loading = false;

  // Single-series bar chart. Bars sit on the baseline with rounded tops; only the
  // tallest bar is labeled, and tapping any bar shows its value under the chart.
  function bars(items, { max, fmt, axis }) {
    const W = 640, H = 210, L = 44, B = 28, T = 22, R = 8;
    const n = items.length, slot = (W - L - R) / Math.max(1, n), bw = Math.min(46, slot * 0.62);
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let out = "";
    for (const g of axis) {
      out += `<line x1="${L}" x2="${W - R}" y1="${y(g.v)}" y2="${y(g.v)}" stroke="var(--line)" stroke-width="1"/>` +
        `<text x="${L - 8}" y="${y(g.v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${g.label}</text>`;
    }
    const top = items.reduce((a, b, i) => (b.value > (items[a] ? items[a].value : -1) ? i : a), 0);
    items.forEach((it, i) => {
      const x = L + slot * i + (slot - bw) / 2, h = Math.max(0, y(0) - y(it.value)), r = Math.min(4, h / 2, bw / 2);
      const yt = y(0) - h;
      const path = h > 0 ? `M${x},${y(0)}V${yt + r}Q${x},${yt} ${x + r},${yt}H${x + bw - r}Q${x + bw},${yt} ${x + bw},${yt + r}V${y(0)}Z` : "";
      out += `<g data-tip="${esc(it.tip)}"><rect x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B + 4}" fill="transparent"/>` +
        (path ? `<path class="bar" d="${path}"/>` : "") +
        `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${esc(it.label)}</text>` +
        (i === top && it.value > 0 ? `<text x="${x + bw / 2}" y="${yt - 6}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${fmt(it.value)}</text>` : "") +
        `<title>${esc(it.tip)}</title></g>`;
    });
    out += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${out}</svg><div class="tip">Tap a bar to see its number.</div>`;
  }

  function tile(k, v, s) { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`; }

  function nightHtml(r) {
    if (!r.parties) return `<div class="r-empty">No finished parties for this night yet.</div>`;
    const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
    const busy = r.busy_hours.map((h) => ({ label: hourLabel(h.hour).replace(" ", "").toLowerCase(), value: Math.round(h.busy * 100), tip: `${hourLabel(h.hour)}: ${Math.round(h.busy * 100)}% of tables had guests` }));
    return `
      <div class="tiles">
        ${tile("Parties seated", r.parties, `<b>${r.turns_per_table.toFixed(1)}</b> per table`)}
        ${tile("Typical meal", min(r.avg_stay), "sit down to leave")}
        ${tile("First service", min(r.avg_first_service), `<b>${plural(r.late_starts, "table")}</b> waited ${min(r.late_after)}+`)}
        ${tile("Wait to clear", min(r.avg_clear_wait), `<b>${plural(r.went_red, "table")}</b> went red`)}
      </div>
      <div class="panel"><h3>How full the room was</h3><div class="sub">Share of tables with guests, hour by hour.</div>
        ${bars(busy, { max: 100, fmt: (v) => `${v}%`, axis: [{ v: 0, label: "0%" }, { v: 50, label: "50%" }, { v: 100, label: "100%" }] })}</div>
      <div class="panels">
        <div class="panel"><h3>Table time not earning</h3><div class="sub">Dirty after guests left, plus clean but empty before the next party.</div>
          <div class="big">${hours(r.idle_table_time)}</div>
          <div class="split"><span>dirty <b>${hours(r.dirty_table_time)}</b></span><span>empty <b>${hours(r.idle_table_time - r.dirty_table_time)}</b></span><span>empty between parties <b>${min(r.avg_empty_between)}</b> on average</span></div>
          <div class="est">${r.extra_parties_estimate != null ? `On a night with a wait, that's roughly <b>${r.extra_parties_estimate.toFixed(1)} more parties</b> at a typical meal length. An estimate, not a promise.` : ""}</div>
        </div>
        <div class="panel"><h3>Slowest moments</h3><div class="sub">Longest waits tonight.</div>
          <ul class="items">
            ${r.worst_clear_wait ? `<li>Table ${esc(r.worst_clear_wait.table)} waited to be cleared <span>${min(r.worst_clear_wait.seconds)}</span></li>` : ""}
            ${r.slowest_first_service.map((x) => `<li>Table ${esc(x.table)}, seated ${timeOf(x.at)}, first service after <span>${min(x.seconds)}</span></li>`).join("")}
          </ul>
        </div>
      </div>
      <div class="panel"><h3>By table</h3>
        <div class="scroll-x"><table class="r">
          <thead><tr><th>Table</th><th class="n">Parties</th><th class="n">Typical meal</th><th class="n">First service</th><th class="n">Wait to clear</th><th class="n">Went red</th></tr></thead>
          <tbody>${r.tables.map((t) => `<tr><td>${esc(t.table)} <span style="color:var(--muted)">· ${t.seats || "?"} seats</span></td><td class="n">${t.parties}</td><td class="n">${min(t.avg_stay)}</td>
            <td class="n">${min(t.avg_first_service)}</td><td class="n">${min(t.avg_clear_wait)}</td><td class="n ${t.went_red ? "flag" : ""}">${t.went_red || dash}</td></tr>`).join("")}</tbody>
        </table></div></div>`;
  }

  function weekHtml(w) {
    if (!w.parties) return `<div class="r-empty">No finished parties in these 7 nights.</div>`;
    const top = Math.max(...w.nights.map((n) => n.parties));
    const nice = top <= 10 ? 10 : Math.ceil(top / 20) * 20;
    const perNight = w.nights.map((n) => ({ label: n.short, value: n.parties, tip: `${n.label}: ${n.parties} parties` }));
    return `
      <div class="tiles">
        ${tile("Parties seated", w.parties, `over 7 nights`)}
        ${tile("Tables went red", w.went_red, "waited 3+ min to be cleared")}
        ${tile("Late first service", w.late_starts, `${min(w.late_after)}+ before anything arrived`)}
        ${tile("Table time not earning", hours(w.idle_table_time), w.extra_parties_estimate ? `roughly <b>${Math.round(w.extra_parties_estimate)}</b> more parties on busy nights` : "")}
      </div>
      <div class="panel"><h3>Parties per night</h3><div class="sub">${w.slowest_clearing_night ? `Slowest clearing: <b>${esc(w.slowest_clearing_night)}</b>.` : ""}</div>
        ${bars(perNight, { max: nice, fmt: (v) => `${v}`, axis: [{ v: 0, label: "0" }, { v: nice / 2, label: `${nice / 2}` }, { v: nice, label: `${nice}` }] })}</div>
      <div class="panel"><h3>Night by night</h3><div class="sub">Tap a night to open its report.</div>
        <div class="scroll-x"><table class="r">
          <thead><tr><th>Night</th><th class="n">Parties</th><th class="n">Typical meal</th><th class="n">First service</th><th class="n">Wait to clear</th><th class="n">Went red</th><th class="n">Busiest</th></tr></thead>
          <tbody>${w.nights.map((n) => `<tr class="go" data-day="${n.day}"><td>${esc(n.label)}</td><td class="n">${n.parties || dash}</td><td class="n">${min(n.avg_stay)}</td>
            <td class="n">${min(n.avg_first_service)}</td><td class="n">${min(n.avg_clear_wait)}</td><td class="n ${n.went_red ? "flag" : ""}">${n.went_red || dash}</td><td class="n">${hourLabel(n.busiest_hour)}</td></tr>`).join("")}</tbody>
        </table></div></div>`;
  }

  function title() {
    if (!data) return "Reports";
    if (mode === "night") return data.label + (day === today ? " (tonight)" : "");
    const fmt = (d) => new Date(d + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric" });
    return `${fmt(data.start)} to ${fmt(data.end)}`;
  }

  function draw() {
    const el = document.getElementById("reports-view");
    const atToday = day === today;
    el.innerHTML = `
      <div class="r-bar">
        <h2>${esc(title())}</h2>
        <div class="seg" role="group" aria-label="Report">
          <button type="button" data-rmode="night" aria-pressed="${mode === "night"}">Night</button>
          <button type="button" data-rmode="week" aria-pressed="${mode === "week"}">Week</button>
        </div>
        <div class="stepper">
          <button type="button" data-step="-1" aria-label="Earlier">‹</button>
          <button type="button" data-step="1" aria-label="Later" ${atToday ? "disabled" : ""}>›</button>
        </div>
      </div>
      ${mode === "night" && atToday ? `<p class="r-note">So far tonight. A party counts once it has left.</p>` : ""}
      ${!data ? `<div class="r-empty">${loading ? "Loading…" : "Couldn't load the report. Check the connection and try again."}</div>` : mode === "night" ? nightHtml(data) : weekHtml(data)}`;
  }

  async function load() {
    loading = true; draw();
    try {
      const url = mode === "night" ? `/api/reports/night${day ? `?day=${day}` : ""}` : `/api/reports/week${day ? `?end=${day}` : ""}`;
      const r = await fetch(url);
      data = r.ok ? await r.json() : null;
      if (data && !today) { today = mode === "night" ? data.day : data.end; day = today; }
    } catch (e) { data = null; }
    loading = false; draw();
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest("#reports-view")) return;
    const m = e.target.closest("[data-rmode]"), s = e.target.closest("[data-step]"), row = e.target.closest("tr[data-day]"), tip = e.target.closest("[data-tip]");
    if (m && m.dataset.rmode !== mode) { mode = m.dataset.rmode; data = null; load(); }
    else if (s && !s.disabled && today) { day = addDays(day || today, Number(s.dataset.step) * (mode === "week" ? 7 : 1)); if (day > today) day = today; data = null; load(); }
    else if (row) { mode = "night"; day = row.dataset.day; data = null; load(); }
    else if (tip) {
      const box = tip.closest(".panel").querySelector(".tip");
      tip.closest("svg").querySelectorAll(".bar.on").forEach((b) => b.classList.remove("on"));
      const bar = tip.querySelector(".bar"); if (bar) bar.classList.add("on");
      box.innerHTML = `<b>${esc(tip.dataset.tip)}</b>`;
    }
  });

  // Called by app.js when the Reports tab opens, and every few minutes while it's open.
  window.Reports = { open() { load(); }, refresh() { if (day === today && !loading) load(); } };
})();
</script>
<script>
// TableWatch host-stand screen: live table states over Server-Sent Events,
// shown as a floor map (with meal rings) or as lanes by what to do.
//
// Quiet by design: only two things raise the alert strip and chime (a table to
// clear, a table nobody has served). Stages, hints and timers are plain text.

const tables = {};       // table id -> { info (from floor.json), t (from the server) }
let floor = null;
let clockOffset = 0;     // server time - local time, in seconds
let lastEventAt = null;  // server time of the camera's last report
let summary = null;
let view = "map", theme = "light";
const CAMERA_STALE_S = 120;
const MEAL_TYPICAL_S = 75 * 60; // only used to draw how far round the meal ring is

const nowServer = () => Date.now() / 1000 + clockOffset;
const mins = (s) => { s = Math.max(0, Math.floor(s / 60)); return s >= 60 ? `${Math.floor(s / 60)} h ${String(s % 60).padStart(2, "0")}` : `${s} min`; };
const clock = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = { FREE: "free", SEATED: "seat", WAIT: "wait", EATING: "eat", FINISHING: "check", LEFT: "left", CLEAR: "clear" };

// ---------- Settings remembered on this iPad ----------
function load(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode: fine */ } }

// ---------- What each table shows ----------
function status(t) {
  const n = nowServer();
  let key = { SERVED: "EATING", CLEAR: "CLEAR", LEFT: "LEFT", FINISHING: "FINISHING", SEATED: "SEATED", FREE: "FREE" }[t.stage] || "FREE";
  if (t.alert === "not_served") key = "WAIT";
  const seatedFor = t.seated_at != null ? n - t.seated_at : 0;
  let label = "", time = "", age = 0;
  switch (key) {
    case "CLEAR": label = "Clear table"; age = n - t.unattended_since; time = clock(age); break;
    case "LEFT": label = "Guests left"; age = n - t.unattended_since; time = clock(age); break;
    case "WAIT": label = "Nothing served"; age = seatedFor; time = mins(age); break;
    case "SEATED": label = "Just seated"; time = seatedFor >= 60 ? mins(seatedFor) : ""; break;
    case "EATING": label = "Eating"; time = seatedFor >= 60 ? mins(seatedFor) : ""; break;
    case "FINISHING": label = "Plates gone"; time = n - t.plates_gone_since >= 60 ? mins(n - t.plates_gone_since) : ""; break;
    default: {
      const emptyFor = t.free_since != null && n - t.free_since >= 60;
      label = emptyFor ? "Empty for" : "Free"; time = emptyFor ? mins(n - t.free_since) : "";
    }
  }
  const alert = key === "CLEAR" ? "clear" : key === "WAIT" ? "wait" : null;
  return { key, label, time, age, alert, hints: t.hints || [], seatedFor };
}
const HINT_TEXT = { check: "check?", long_stay: "long stay" };

// ---------- Map view ----------
const W = 1000, H = 700;
function geo(info) {
  const shape = info.shape || "square";
  const base = { round: [74, 74], square: [90, 90], booth: [118, 84], rect: [60 + 26 * (info.seats || 6), 66] }[shape] || [90, 90];
  return { x: info.x * W / 100, y: info.y * H / 100, w: info.w ? info.w * W / 100 : base[0], h: info.h ? info.h * H / 100 : base[1], shape, seats: info.seats || 4 };
}
function chairs(g) {
  const out = [], { x, y, w, h } = g;
  const r = (cx, cy, cw, ch) => out.push(`<rect x="${cx - cw / 2}" y="${cy - ch / 2}" width="${cw}" height="${ch}" rx="6" style="fill:var(--chair)"/>`);
  if (g.shape === "round") { r(x - w / 2 - 15, y, 16, 34); r(x + w / 2 + 15, y, 16, 34); }
  else if (g.shape === "booth") { r(x - w / 2 - 16, y, 20, h + 12); r(x + w / 2 + 16, y, 20, h + 12); }
  else if (g.shape === "rect") {
    const perSide = Math.max(1, Math.round((g.seats - 2) / 2)), step = w / perSide;
    for (let i = 0; i < perSide; i++) { const cx = x - w / 2 + step * (i + 0.5); r(cx, y - h / 2 - 14, Math.min(40, step - 8), 14); r(cx, y + h / 2 + 14, Math.min(40, step - 8), 14); }
    r(x - w / 2 - 14, y, 14, 36); r(x + w / 2 + 14, y, 14, 36);
  } else { r(x, y - h / 2 - 14, 36, 14); r(x, y + h / 2 + 14, 36, 14); r(x - w / 2 - 14, y, 14, 36); r(x + w / 2 + 14, y, 14, 36); }
  return out.join("");
}
function shapeEl(g, style, extra = "") {
  return g.shape === "round"
    ? `<circle cx="${g.x}" cy="${g.y}" r="${g.w / 2}" style="${style}" ${extra}/>`
    : `<rect x="${g.x - g.w / 2}" y="${g.y - g.h / 2}" width="${g.w}" height="${g.h}" rx="${g.shape === "rect" ? 14 : 12}" style="${style}" ${extra}/>`;
}
function mealRing(g, s) {
  let p = 0;
  if (s.key === "SEATED" || s.key === "WAIT") p = 0.1;
  else if (s.key === "EATING") p = Math.min(0.8, 0.25 + (s.seatedFor / MEAL_TYPICAL_S) * 0.55);
  else if (s.key === "FINISHING") p = 0.9;
  const pad = 9;
  if (g.shape === "round") {
    const r = g.w / 2 + pad, L = 2 * Math.PI * r;
    return `<circle cx="${g.x}" cy="${g.y}" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="7"/>` +
      (p ? `<circle cx="${g.x}" cy="${g.y}" r="${r}" fill="none" style="stroke:var(--seat)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${p * L} ${L}" transform="rotate(-90 ${g.x} ${g.y})"/>` : "");
  }
  const w = g.w + pad * 2, h = g.h + pad * 2, L = 2 * (w + h);
  const box = `x="${g.x - w / 2}" y="${g.y - h / 2}" width="${w}" height="${h}" rx="16" fill="none" stroke-width="7"`;
  return `<rect ${box} style="stroke:var(--track)"/>` + (p ? `<rect ${box} style="stroke:var(--seat)" stroke-linecap="round" pathLength="${L}" stroke-dasharray="${p * L} ${L}"/>` : "");
}
function roomEl() {
  const room = (floor && floor.room) || {};
  let out = `<rect x="20" y="24" width="960" height="652" rx="6" style="fill:var(--surface);stroke:var(--wall)" stroke-width="4"/>`;
  for (const l of room.landmarks || []) {
    const w = l.w * W / 100, h = l.h * H / 100, x = l.x * W / 100, y = l.y * H / 100, tall = h > w;
    out += `<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="8" style="fill:var(--chair)"/>` +
      `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="14" style="fill:var(--faint)" ${tall ? `transform="rotate(90 ${x} ${y})"` : ""}>${esc(l.label)}</text>`;
  }
  for (const l of room.labels || []) out += `<text x="${l.x * W / 100}" y="${l.y * H / 100}" text-anchor="middle" font-size="13" style="fill:var(--faint)">${esc(l.text)}</text>`;
  if (room.host) {
    const x = room.host.x * W / 100, y = room.host.y * H / 100;
    out += `<circle cx="${x}" cy="${y}" r="9" style="fill:var(--text)"/><text x="${x + 16}" y="${y + 5}" font-size="14" font-weight="700" style="fill:var(--text)">You</text>`;
  }
  return out;
}
function renderMap() {
  let out = roomEl();
  for (const id in tables) {
    const { info, t } = tables[id];
    if (!t) continue;
    const g = geo(info), s = status(t);
    const solid = s.alert === "clear" ? "var(--clear)" : s.alert === "wait" ? "var(--wait)" : null;
    const free = s.key === "FREE", left = s.key === "LEFT";
    const fill = solid || (free ? "var(--free-soft)" : "var(--surface)");
    const stroke = solid || (free ? "var(--free)" : left ? "var(--left)" : "var(--track)");
    const ink = solid ? "var(--on-alert)" : "var(--text)";
    const small = g.shape === "round";
    const timeText = free && s.time ? (small ? s.time : `empty ${s.time}`) : s.time;
    out += `<g ${s.alert ? `class="tap" data-act="${esc(id)}"` : ""} aria-label="Table ${esc(info.name)}: ${s.label} ${s.time}">` +
      chairs(g) + (solid || free ? "" : mealRing(g, s)) +
      shapeEl(g, `fill:${fill};stroke:${stroke}`, `stroke-width="${solid ? 0 : 2.5}" ${left ? 'stroke-dasharray="6 5"' : ""}`) +
      `<text x="${g.x}" y="${g.y + (timeText ? -3 : 10)}" text-anchor="middle" font-size="${small ? 28 : 32}" font-weight="800" style="fill:${ink}">${esc(info.name)}</text>` +
      (timeText ? `<text x="${g.x}" y="${g.y + 19}" text-anchor="middle" font-size="${small ? 12.5 : 14}" font-weight="600" style="fill:${solid ? "var(--on-alert)" : "var(--muted)"}">${timeText}</text>` : "") +
      s.hints.map((h, i) => `<g transform="translate(${g.x - 37} ${g.y + g.h / 2 + (g.shape === "booth" ? 14 : 28) + i * 24})"><rect width="74" height="21" rx="10.5" style="fill:var(--hint-bg);stroke:var(--hint-line)"/><text x="37" y="15" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--hint)">${HINT_TEXT[h] || h}</text></g>`).join("") +
      `</g>`;
  }
  document.getElementById("map").innerHTML = out;
}

// ---------- List view ----------
const LANES = [
  { name: "Clear now", sub: "tap when cleared", c: "var(--clear)", keys: ["CLEAR"] },
  { name: "Needs service", sub: "nothing on the table yet", c: "var(--wait)", keys: ["WAIT", "SEATED"] },
  { name: "Eating", sub: "", c: "var(--seat)", keys: ["EATING"] },
  { name: "Wrapping up", sub: "plates gone or just left", c: "var(--left)", keys: ["FINISHING", "LEFT"] },
  { name: "Open", sub: "ready to seat", c: "var(--free)", keys: ["FREE"] },
];
const TICKET_COLOR = { CLEAR: "var(--clear)", WAIT: "var(--wait)", SEATED: "var(--track)", EATING: "var(--seat)", FINISHING: "var(--seat)", LEFT: "var(--left)", FREE: "var(--free)" };
function renderList() {
  const all = Object.entries(tables).filter(([, x]) => x.t).map(([id, x]) => ({ id, info: x.info, s: status(x.t) }));
  document.getElementById("list-view").innerHTML = LANES.map((l) => {
    const items = all.filter((x) => l.keys.includes(x.s.key)).sort((a, b) => (l.keys.indexOf(a.s.key) - l.keys.indexOf(b.s.key)) || (b.s.age - a.s.age));
    return `<section class="lane" style="--c:${l.c}"><h2>${l.name} <span>${items.length}</span></h2>${l.sub ? `<div class="sub">${l.sub}</div>` : ""}
      <div class="tickets">${items.length ? items.map(({ id, info, s }) => {
        const tag = s.alert ? "button" : "div";
        return `<${tag} class="ticket ${s.alert ? "act" : ""}" ${s.alert ? `data-act="${esc(id)}"` : ""} style="--c:${TICKET_COLOR[s.key]}">
          <div class="num">${esc(info.name)}</div>
          <div class="what">${icon(ICON[s.key])}<span>${s.label}</span></div>
          <div class="time">${s.time || (s.key === "FREE" ? "ready" : "just now")}</div>
          <div class="meta"><span>${info.seats || "?"} seats${info.section ? " · " + esc(info.section) : ""}</span>${s.hints.map((h) => `<span class="h">${HINT_TEXT[h] || h}</span>`).join("")}</div>
          ${s.alert ? `<div class="do">${s.alert === "clear" ? "Tap when cleared" : "Tap once someone has been over"}</div>` : ""}
        </${tag}>`;
      }).join("") : `<div class="empty">none</div>`}</div></section>`;
  }).join("");
}

// ---------- Header, alerts, footer ----------
function renderHeader() {
  document.getElementById("clock").textContent = new Date(nowServer() * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (summary) {
    const s = summary;
    const dots = document.getElementById("dots");
    dots.classList.toggle("bar", s.tables_total > 16); // a dot per table, or a bar for big rooms
    dots.innerHTML = s.tables_total > 16
      ? `<i style="width:${(100 * s.tables_in_use) / Math.max(1, s.tables_total)}%"></i>`
      : Array.from({ length: s.tables_total }, (_, i) => `<i class="${i < s.tables_in_use ? "on" : ""}"></i>`).join("");
    document.getElementById("fill-text").innerHTML = `<b>${s.tables_in_use} of ${s.tables_total}</b> tables<br><b>${s.seats_in_use} of ${s.seats_total}</b> seats`;
  }
  for (const v of ["map", "list", "reports"]) document.getElementById("v-" + v).setAttribute("aria-pressed", view === v);
  document.getElementById("theme").innerHTML = theme === "light" ? `${icon("moon")}Dark` : `${icon("sun")}Light`;
  const snd = document.getElementById("sound");
  snd.innerHTML = `${icon("bell")}${audio ? "Sound on" : "Sound off"}`;
  snd.classList.toggle("on", !!audio);
}
function urgent() {
  return Object.entries(tables).filter(([, x]) => x.t).map(([id, x]) => ({ id, info: x.info, s: status(x.t) }))
    .filter((x) => x.s.alert)
    .sort((a, b) => (a.s.alert === b.s.alert ? b.s.age - a.s.age : a.s.alert === "clear" ? -1 : 1));
}
function renderAlerts() {
  const el = document.getElementById("alerts");
  if (view === "list") { el.innerHTML = ""; return; } // the first two lanes are the alerts
  const u = urgent();
  el.innerHTML = u.length ? u.map(({ id, info, s }) => `<button class="alert ${s.alert}" data-act="${esc(id)}">${icon(ICON[s.key])}
      <span>Table ${esc(info.name)} <small>${s.alert === "clear" ? `clear it · ${s.time}` : `nothing served · ${s.time}`}</small></span>
      <em>${s.alert === "clear" ? "Cleared" : "Visited"}</em></button>`).join("")
    : `<div class="calm">All good. Nothing needs you right now.</div>`;
}
function renderFooter() {
  const parts = [];
  const approx = (secs) => (secs < 60 ? "under 1 min" : `${Math.round(secs / 60)} min`);
  if (summary && summary.avg_first_service != null) parts.push(`<span>First service tonight <b>${approx(summary.avg_first_service)}</b></span>`);
  if (summary && summary.avg_empty_between != null) parts.push(`<span>Empty between parties <b>${approx(summary.avg_empty_between)}</b></span>`);
  if (!parts.length) parts.push(`<span>Tonight's averages appear once the first parties have left.</span>`);
  const key = view === "map" ? `<div class="key">
      <span><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" style="stroke:var(--track)" stroke-width="3"/><path d="M10 3a7 7 0 0 1 7 7" fill="none" style="stroke:var(--seat)" stroke-width="3" stroke-linecap="round"/></svg>ring fills as the meal goes on</span>
      <span><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" style="fill:var(--free-soft);stroke:var(--free)" stroke-width="2"/></svg>free</span>
      <span><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" style="fill:var(--surface);stroke:var(--left)" stroke-width="2" stroke-dasharray="4 3"/></svg>guests left</span>
    </div>` : "";
  document.getElementById("footer").innerHTML = parts.join("") + key;
}
function render() {
  document.documentElement.dataset.theme = theme;
  document.getElementById("map-view").hidden = view !== "map";
  document.getElementById("list-view").hidden = view !== "list";
  document.getElementById("reports-view").hidden = view !== "reports";
  document.getElementById("footer").hidden = view === "reports";
  renderHeader();
  renderAlerts(); // stays visible on Reports too, so a red table is never missed
  if (view === "map") renderMap(); else if (view === "list") renderList(); // reports draw themselves
  renderFooter();
  renderCamera();
  checkChime();
}

// ---------- Sound: one soft two-note chime per new alert ----------
// iPad Safari only plays sound after a tap, so staff tap "Sound off" once per shift.
let audio = null;
const chimed = new Set();
function chime() {
  if (!audio) return;
  const t0 = audio.currentTime;
  [[880, 0], [660, 0.18]].forEach(([freq, at]) => {
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0 + at);
    gain.gain.exponentialRampToValueAtTime(0.25, t0 + at + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.5);
    osc.connect(gain).connect(audio.destination);
    osc.start(t0 + at);
    osc.stop(t0 + at + 0.55);
  });
}
function checkChime() {
  let fresh = false;
  const live = new Set();
  for (const { id, s } of urgent()) {
    const k = id + ":" + s.alert;
    live.add(k);
    if (!chimed.has(k)) { chimed.add(k); fresh = true; }
  }
  for (const k of [...chimed]) if (!live.has(k)) chimed.delete(k);
  if (fresh) chime(); // one chime even if several alerts appear at once
}
function toggleSound() {
  if (audio) { audio.close(); audio = null; }
  else { try { audio = new (window.AudioContext || window.webkitAudioContext)(); chime(); } catch (e) { audio = null; } }
  render();
}

// ---------- Actions ----------
async function post(id, action) {
  try {
    const r = await fetch(`/api/tables/${encodeURIComponent(id)}/${action}`, { method: "POST" });
    if (r.ok) { tables[id].t = await r.json(); render(); }
  } catch (e) { setOnline(false); }
}
function onAct(id) {
  const x = tables[id];
  if (!x || !x.t) return;
  const s = status(x.t);
  if (s.alert === "clear") post(id, "clear");
  else if (s.alert === "wait") post(id, "served"); // "someone has been over"
}

// ---------- Connection and camera health ----------
async function loadAll() {
  const data = await (await fetch("/api/tables")).json();
  clockOffset = data.now - Date.now() / 1000;
  lastEventAt = data.last_event_at;
  summary = data.summary;
  for (const t of data.tables) if (tables[t.id]) tables[t.id].t = t;
  render();
}
function renderCamera() {
  const el = document.getElementById("nocam");
  const offline = !document.getElementById("offline").hidden;
  const age = lastEventAt == null ? null : nowServer() - lastEventAt;
  const stale = age == null || age > CAMERA_STALE_S;
  el.hidden = !stale || offline;
  el.textContent = age == null
    ? "Waiting for camera data… (table colors are not live yet)"
    : `No camera data for ${Math.floor(age / 60)} min. Check the camera box. Table colors may be out of date.`;
  document.body.classList.toggle("stale", stale || offline);
}
function setOnline(ok) {
  document.getElementById("offline").hidden = ok;
  const c = document.getElementById("conn");
  c.textContent = ok ? "Live" : "Offline";
  c.classList.toggle("ok", ok);
  renderCamera();
}
function connect() {
  const es = new EventSource("/api/stream");
  es.onopen = () => { setOnline(true); loadAll().catch(() => setOnline(false)); };
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    clockOffset = msg.now - Date.now() / 1000;
    lastEventAt = msg.last_event_at;
    summary = msg.summary;
    if (tables[msg.table.id]) tables[msg.table.id].t = msg.table;
    render();
  };
  es.onerror = () => setOnline(false); // EventSource reconnects by itself
}

async function main() {
  const params = new URLSearchParams(location.search);
  view = params.get("view") || load("tw-view", "map");
  theme = params.get("theme") || load("tw-theme", "light");
  floor = await (await fetch("/api/floor")).json();
  for (const info of floor.tables) tables[info.id] = { info, t: null };
  document.getElementById("map").setAttribute("viewBox", `0 0 ${W} ${H}`);
  document.querySelectorAll("header .seg button").forEach((b) => b.addEventListener("click", () => {
    view = b.dataset.view; save("tw-view", view); render();
    if (view === "reports") window.Reports.open();
  }));
  document.getElementById("theme").addEventListener("click", () => { theme = theme === "light" ? "dark" : "light"; save("tw-theme", theme); render(); });
  document.getElementById("sound").addEventListener("click", toggleSound);
  document.body.addEventListener("click", (e) => { const a = e.target.closest("[data-act]"); if (a) onAct(a.dataset.act); });
  if (!["map", "list", "reports"].includes(view)) view = "map";
  render();
  if (view === "reports") window.Reports.open();
  connect();
  setInterval(render, 1000);
  setInterval(() => { if (view === "reports") window.Reports.refresh(); }, 120000);
  // Full refresh every 30 s: picks up the camera's heartbeat and anything missed.
  setInterval(() => loadAll().catch(() => setOnline(false)), 30000);
  // iPad wakes from sleep: refresh everything.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll().catch(() => setOnline(false)); });
}

main().catch(() => { setOnline(false); setTimeout(() => location.reload(), 5000); });
</script>
