<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tables">
<title>TableWatch</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-clear" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="9" ry="3.6"/><ellipse cx="12" cy="11.5" rx="6.5" ry="2.6"/><path d="M8.5 6.5c.8-1 1.8-1 2.6 0M13 6c.8-1 1.8-1 2.6 0"/></symbol>
    <symbol id="i-wait" viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/></symbol>
    <symbol id="i-eat" viewBox="0 0 24 24"><path d="M5 3v5a3 3 0 0 0 6 0V3M8 3v18M17 3c-2.5 2-2.5 7 0 9v9"/></symbol>
    <symbol id="i-seat" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5zM9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></symbol>
    <symbol id="i-free" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-long" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><rect x="13" y="12" width="5" height="4" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  </svg>

  <header>
    <div class="clock" id="clock"></div>
    <div class="fill">
      <div class="dots" id="dots"></div>
      <span id="fill-text"></span>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="v-map" data-view="map"><svg class="icon"><use href="#i-map"/></svg>Map</button>
      <button type="button" id="v-list" data-view="list"><svg class="icon"><use href="#i-list"/></svg>List</button>
    </div>
    <button type="button" class="pill" id="theme"></button>
    <button type="button" class="pill" id="sound"></button>
    <div id="conn" class="conn">Connecting…</div>
  </header>
  <div class="alerts" id="alerts"></div>
  <main id="map-view"><svg id="map" role="img" aria-label="Floor plan with table status"></svg></main>
  <main id="list-view" class="lanes" hidden></main>
  <footer id="footer"></footer>
  <div id="offline" class="banner-bottom" hidden>Connection lost. Reconnecting… (table colors may be out of date)</div>
  <div id="nocam" class="banner-bottom" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
