<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tables">
<title>TableWatch</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Tables</h1>
    <div class="fill" aria-label="Room fullness">
      <div class="fill-text"><b id="f-tables">0 / 0</b> tables · <b id="f-seats">0 / 0</b> seats</div>
      <div class="fill-bar"><div id="f-bar"></div></div>
    </div>
    <div class="tonight" id="tonight"></div>
    <button id="sound" class="sound" type="button">Sound off</button>
    <div id="conn" class="conn">Connecting…</div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="floor"></main>
  <div id="offline" class="offline" hidden>Connection lost. Reconnecting… (statuses may be out of date)</div>
  <div id="nocam" class="offline" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
